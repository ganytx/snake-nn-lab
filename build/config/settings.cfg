# Snake Game Settings
#
# NOTE: this file is the TEMPLATE, not the copy the game actually reads.
# The game reads <dir-of-exe>\config\settings.cfg, i.e. build\config\settings.cfg
# (run.bat uses `start`, which sets the working directory to build\).
#
#   Want to change the defaults -> edit this file, then re-run build.bat
#   Just experimenting          -> edit build\config\settings.cfg directly,
#                                   or use the in-game settings screen
#
# Comments are ASCII on purpose: this file gets copied into build\ by CMake,
# and CMake re-encodes the text, which mangles UTF-8 Chinese comments.
#
# Map: bigger = harder to travel, and the fixed 1024px vision covers less of it.
#
# 2026-09-26: 4000 -> 3000 (负责人指定), 与训练地图保持一致。
#   Why this matters: the game was 4000x4000 while training ran on 2000x2000 --
#   a 4x area difference. Vision (512px radius) covers 6.5% of 2000x2000 but only
#   1.6% of 4000x4000, and zone spacing (0.40~0.60 x short side) went from
#   800~1200px to 1600~2400px. That is a concrete, measurable reason why
#   "weights trained fine but the snake plays dumb in the game".
map_width=3000
map_height=3000
snake_speed=250
snake_boost_speed=450
snake_turn_rate=8
snake_init_segs=12
segment_spacing=20
food_max_count=120
food_spawn_count=2
food_spawn_interval=2
food_segments=1
food_lifetime=20
corpse_lifetime=30
# --- food zones (see docs/70) ---
# zone_count=0 turns zones off and falls back to random scattering
zone_count=2
# zone centre distance from map centre / min(mapW,mapH)
zone_center_ratio=0.31
# zone radius / min(mapW,mapH)
#
# 2026-09-26: 0.075 -> 0.05 (负责人要求"圈改成训练模式的大小").
#   3000 x 0.05 = 150px -- the SAME pixel value training uses
#   (2000 x 0.075 = 150px). Zone size is a gameplay feel, not a ratio:
#   keeping 0.075 on a 3000 map would give 225px, a 1.5x bigger zone.
zone_radius_ratio=0.05
# how many seconds each zone keeps spawning (9s -> 9 food at 1/s)
zone_spawn_seconds=9
# silent gap between two zones (lets the losers catch up)
zone_gap_seconds=5
# food per second per 9 snakes (scales with the ALIVE snake count)
#
# 0.111111 = 每秒 1 个（9 条蛇时）。
#
# 曾经调到 0.4 试过 —— 实测【更糟】：食物堆到 156 个没人吃，蛇 28 秒全灭。
# 因为瓶颈不是食物量，是"蛇走不到圈里"。见 docs/70 第 9.6 节。
# 所以恢复原值。
food_per_snake=0.111111
corpse_segments=2
corpse_score=3
starvation_time=20
collision_forgive=5
# --- match (teams / per-team brain / time limit) ---
team_count=3
snakes_per_team=3
player_team=0
match_time_limit=0
friendly_fire=0
ally_visible_count=2
# --- which brain each team uses (ids from BrainRegistry) ---
team_brain_0=rule
team_brain_1=rule
team_brain_2=rule
team_brain_3=rule
team_brain_4=rule
team_brain_5=rule
team_brain_6=rule
team_brain_7=rule
